[project]
name = "gas-sensor-drift-ml-benchmark"
version = "0.1.0"
description = "Reproducible classification, regression and clustering benchmark under gas sensor drift."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "requests>=2.32",
  "streamlit>=1.38",
  "plotly>=5.24",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "jupyter>=1.1",
  "nbconvert>=7.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
